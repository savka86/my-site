/* Пульс школы — обновленная визуальная система */
:root{--bg:#f4f7fb;--surface:#fff;--ink:#14213b;--muted:#708199;--line:#e4eaf2;--blue:#295bdf;--blue-dark:#1f4ac5;--soft:#edf3ff;--green:#159b74;--amber:#e6a43a;--rose:#d65e77;--shadow:0 10px 35px rgba(25,47,89,.045)}
*{box-sizing:border-box}
body{background:radial-gradient(circle at 70% -20%,#e9f1ff 0,transparent 41%),#f6f8fc;color:var(--ink);font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.55}
.app{min-height:100vh;align-items:stretch}
.sidebar{width:264px;background:#101d35;box-shadow:10px 0 42px rgba(15,28,57,.08);border-right:1px solid #243650;padding:30px 15px 18px}

.logo{background:linear-gradient(150deg,#5ee4c3,#26a9ea);color:#0a2944;width:44px;height:44px;border-radius:15px;box-shadow:0 8px 18px #13bcdb24;font-size:25px}
.brand-title{font-size:19px;letter-spacing:-.5px}.brand-sub{color:#8bb3d0;font-size:9px;letter-spacing:1.5px}
.nav-label{color:#7489a5;padding-top:2px}.nav-btn{min-height:45px;border-radius:10px;font-size:13px;font-weight:650;padding:11px 12px;margin:2px 0;color:#adbed7;transition:.17s}
.nav-btn .sym{width:23px;min-width:23px;font-size:19px;font-family:'Segoe UI Symbol',sans-serif;color:#9bb0c9}
.nav-btn.active{background:linear-gradient(100deg,#345cbb,#3f71d5);box-shadow:inset 3px 0 0 #90dce9,0 8px 18px #0002;color:#fff}
.nav-btn.active .sym{color:#e3faff}.nav-btn:hover:not(.active){background:#1e2e49;color:#fff}
.side-bottom{background:#1b2b47;border-color:#2a4469;padding:16px 14px;border-radius:13px}.side-bottom small{color:#93aac7}.side-bottom strong{font-size:13px}
.main{max-width:1760px;padding:33px clamp(22px,3.6vw,60px) 70px}
.topbar{align-items:center;margin-bottom:22px;gap:18px}
.topbar h1{font-size:clamp(27px,2.4vw,36px);font-weight:810;letter-spacing:-1.15px;margin:0}
.eyebrow{color:#3d7eaf;font-size:10px;letter-spacing:1.8px;margin-bottom:6px}
.page-sub{color:#74849a;font-size:13px;line-height:1.6;margin:7px 0 0}
.btn{border-radius:10px;padding:10px 15px;min-height:41px;box-shadow:none;transition:.16s;border-color:#e0e7f0;color:#304460;font-weight:700}
.btn:hover{border-color:#b4c8f9;transform:translateY(-1px);background:#f6f9ff}
.btn.primary{border-color:#2862e2;background:#2862e2;box-shadow:0 6px 12px #2862e21d}
.btn.primary:hover{background:#1e4fc2;color:#fff;box-shadow:0 8px 14px #2862e235}
.btn.danger{color:#b94354}
.workspace{background:#fff;border:1px solid #e4ebf5;padding:14px 16px;border-radius:13px;box-shadow:0 3px 18px #1a346907;gap:11px;margin-bottom:24px}
.workspace label{font-size:11px;letter-spacing:.2px;color:#8290a4}
.workspace select{background:#f2f6fc;border:1px solid #e8eef7;color:#243d62;padding:9px 30px 9px 12px;max-width:255px;font-weight:720}
.tag{border-radius:8px;font-size:11px;padding:6px 10px}
.grid4{gap:15px}
.stat{padding:21px 22px;min-height:141px;border:1px solid #e5ebf5;border-radius:16px;box-shadow:0 3px 17px #13274906}
.stat:after{width:85px;height:85px;right:-17px;top:-24px;opacity:.74}
.stat-label{font-size:12px;color:#6e829a;font-weight:690}.stat-value{font-size:37px;line-height:1.18;margin:13px 0 4px;letter-spacing:-1.5px}
.stat-note{font-size:11px;color:#8997aa}.stats-symbol{font-size:19px;top:18px;right:21px}
.panel{border-radius:17px;border:1px solid #e4ebf4;padding:23px;box-shadow:0 4px 22px #142b5507}
.panel-head{margin-bottom:17px}.panel-head h2{font-size:17px;font-weight:780;letter-spacing:-.3px}
.layout2{gap:17px;margin-top:17px}.section{margin-top:19px}
.roster-group{margin:23px 0 30px}.roster-group:first-child{margin-top:10px}
.roster-group-head{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #edf1f5}
.roster-group-head b{color:#294060;font-size:13px}
.roster-group-head span{background:#f1f5fc;padding:4px 9px;border-radius:7px;font-size:11px}
.roster-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.roster-tile{min-height:121px;position:relative;border:1px solid #e0e8f2;border-radius:14px;background:#fbfcff;padding:16px;box-shadow:0 2px 9px #20386604;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s}
.roster-tile:hover{background:#eff6ff;transform:translateY(-3px);box-shadow:0 8px 23px #1f55a51b;border-color:#8cb4f3}
.roster-tile b{font-size:23px;color:#1e385c;letter-spacing:-.4px}
.roster-tile span{color:#8391a5;font-size:11px}
.roster-tile:after{content:'↗';position:absolute;top:11px;right:14px;color:#9aacc6;font-size:14px}
.banner{border-radius:17px!important;background:linear-gradient(112deg,#162e57,#234d85 54%,#196978)!important;border:1px solid #284e78!important;box-shadow:0 12px 29px #15366817;color:#f9ffff!important;padding:24px 28px!important;gap:20px}
.banner strong{font-size:18px}.banner .muted,.banner p,.banner small{color:#c1dcec!important}
.banner .btn{background:white;color:#1e476f}
.field input,.field textarea,.field select,.filter-input{border-radius:10px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus,.filter-input:focus{border-color:#78a4ef;box-shadow:0 0 0 3px #a9c7fc40}
.table-scroll{border-radius:12px;overflow:auto}
.table-scroll th{background:#f4f7fb;padding:13px 13px;color:#647a98;font-size:10px;letter-spacing:.6px}
.table-scroll td{padding:12px 13px;font-size:12px}
.table-scroll tbody tr:nth-child(even){background:#fafbfd}
.table-scroll tbody tr:hover{background:#eff5ff}
.report{box-shadow:none;border-radius:10px}.modal{border-radius:18px}.modal::backdrop{background:#091a39a8;backdrop-filter:blur(3px)}
.portal-topline{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#6f8299;font-size:12px}

.portal-topline strong{color:#2b3f5c}

.live-banner strong{color:#27549a}
.live-banner.cloud{background:#eafaf2;border-color:#ceefdc;color:#256146}

<script>
'use strict';
const LS='school_pulse_demo_v1', CFG='school_pulse_cloud_cfg_v1', CLOUD_SESSION='school_pulse_session_v1';
const levels={municipal:'Муниципальный',regional:'Республиканский',national:'Всероссийский',international:'Международный'};
const forms={inperson:'Очно',remote:'Дистанционно',absentia:'Заочно'};
const awards={participant:'Участие',winner:'Победитель',prize:'Призёр'};
const categories={creative:'Творческие конкурсы',sport:'Спортивные соревнования'};
const programs={vud:'Внеурочная деятельность',club:'Общешкольные кружки',extra:'Дополнительное образование'};
const upbringing={high:'Высокий',medium:'Средний',low:'Низкий',none:'Не указано'};
const navItems=[['overview','▦','Обзор школы'],['classes','▦','Все 25 классов'],['students','♙','Обучающиеся'],['achievements','✧','Конкурсы и спорт'],['activities','▤','Занятость'],['reports','▣','Готовые отчёты'],['manage','⚙','Классы и педагоги'],['settings','◉','Настройки']];
const $=(sel,root=document)=>root.querySelector(sel);const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
function eid(){return globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():'x'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function xml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function nice(n){return Number(n||0).toLocaleString('ru-RU')}
function sortClasses(a,b){const x=x=>[parseInt(x.title,10)||99,(x.title.match(/[^\d\s]+/)||[''])[0]];const aa=x(a),bb=x(b);return aa[0]-bb[0]||aa[1].localeCompare(bb[1],'ru')}
const ROSTER_GROUPS=[
 {title:'Начальная школа · 1–4 классы',ids:['1А','1Б','2А','2Б','3А','3Б','4А','4Б']},
 {title:'Основная школа · 5–8 классы',ids:['5А','5Б','6А','6Б','6В','7А','7Б','8А','8Б']},
 {title:'Старшие классы · 9–11',ids:['9А','9Б','9В','10А','10Б','11А','11Б','11В']}
];
const ROSTER=ROSTER_GROUPS.flatMap(g=>g.ids), REPORT_PERIODS=['1 полугодие','2 полугодие','Весь год'];
function fullClassRoster(){return REPORT_PERIODS.flatMap(period=>ROSTER.map(title=>({id:eid(),title,teacher_name:'',academic_year:'2026–2027',period})));}
function emptyDB(){return {classes:[],students:[],achievements:[],enrollments:[],profiles:[]}}
function ensureRoster(db){ // Upgrade earlier demo versions without deleting entered data.
 if(!db || !Array.isArray(db.classes))return seed();
 const known=new Set(db.classes.map(c=>[c.academic_year,c.period,c.title].join('|')));
 for(const c of fullClassRoster()){const key=[c.academic_year,c.period,c.title].join('|');if(!known.has(key)){db.classes.push(c);known.add(key)}}
 return db;
}
function seed(){
 const classes=fullClassRoster(),c1=classes.find(c=>c.title==='2А'&&c.period==='1 полугодие').id,c2=classes.find(c=>c.title==='5Б'&&c.period==='1 полугодие').id;
 const p1=eid(),p2=eid(),p3=eid(),p4=eid(),p5=eid(),p6=eid();
 const students=[['Алексеева Анна',c1,'high',p1],['Иванов Мирон',c1,'medium',p2],['Петрова София',c1,'high',p3],['Сидоров Артём',c1,'medium',p4],['Кузнецова Ева',c2,'medium',p5],['Николаев Максим',c2,'low',p6]].map(([full_name,class_id,upbringing,id])=>({id,class_id,full_name,upbringing}));
 const achievements=[
  {id:eid(),class_id:c1,student_id:p1,category:'creative',level:'regional',event_name:'Конкурс рисунков «Мой край»',participation_form:'remote',result_text:'1 место',award:'winner',supervisor:'Пример',event_date:'2026-10-16'},
  {id:eid(),class_id:c1,student_id:p2,category:'creative',level:'municipal',event_name:'Читающая семья',participation_form:'inperson',result_text:'Сертификат',award:'participant',supervisor:'Пример',event_date:'2026-10-20'},
  {id:eid(),class_id:c1,student_id:p3,category:'sport',level:'regional',event_name:'Шахматный турнир',participation_form:'inperson',result_text:'2 место',award:'prize',supervisor:'Пример',event_date:'2026-10-21'},
  {id:eid(),class_id:c2,student_id:p5,category:'creative',level:'national',event_name:'Всероссийский конкурс чтения',participation_form:'remote',result_text:'Призёр',award:'prize',supervisor:'Пример',event_date:'2026-10-29'}
 ];
 const enrollments=[{id:eid(),class_id:c1,student_id:p1,category:'vud',program_name:'Разговоры о важном'},{id:eid(),class_id:c1,student_id:p2,category:'vud',program_name:'Разговоры о важном'},{id:eid(),class_id:c1,student_id:p3,category:'vud',program_name:'Орлята России'},{id:eid(),class_id:c1,student_id:p4,category:'club',program_name:'Ойулук Нам'},{id:eid(),class_id:c1,student_id:p1,category:'extra',program_name:'ДШИ'},{id:eid(),class_id:c2,student_id:p5,category:'extra',program_name:'ДЮСШ'}];
 return {classes,students,achievements,enrollments,profiles:[]};
}
function readDemo(){try{const v=JSON.parse(localStorage.getItem(LS));return v&&Array.isArray(v.classes)&&Array.isArray(v.students)?ensureRoster(v):seed()}catch{return seed()}}
const S={db:readDemo(),mode:'demo',role:'deputy',view:'signin',year:'2026–2027',period:'1 полугодие',classId:'all',eventCategory:'all',eventLevel:'all',query:'',profile:null,token:null,refreshToken:null,cloudCfg:null,loading:false};
function persist(){if(S.mode==='demo')try{localStorage.setItem(LS,JSON.stringify(S.db))}catch{}}
function savedCfg(){const preset={url:'https://yyrqvxbpmtyxkezxwuew.supabase.co',key:'sb_publishable_MMdBHDi9WLs4kDL6mmaRXw_7iIjP2fL'};try{return {...preset,...JSON.parse(localStorage.getItem(CFG)||'{}')}}catch{return preset}}
function toast(msg,err=false){let e=$('#toast');e.textContent=msg;e.className='toast'+(err?' err':'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4800)}
function activeClasses(){return S.db.classes.filter(c=>c.academic_year===S.year&&c.period===S.period).sort(sortClasses)}
function accessibleClasses(){const all=activeClasses();return S.mode==='cloud'&&S.role==='teacher'?all.filter(c=>{const home=S.db.classes.find(x=>x.id===S.profile?.class_id);return home&&c.title===home.title&&c.academic_year===home.academic_year}):all}
function chosenClasses(){const ac=accessibleClasses();return S.classId==='all'?ac:ac.filter(c=>c.id===S.classId)}
function classIds(){return new Set(chosenClasses().map(c=>c.id))}
function scopedRows(key){const ids=classIds();return S.db[key].filter(r=>ids.has(r.class_id))}
function canEditClass(id){return !!id&&(S.mode==='demo'||S.role!=='teacher'||S.db.classes.some(c=>c.id===id&&c.title===S.db.classes.find(z=>z.id===S.profile?.class_id)?.title&&c.academic_year===S.db.classes.find(z=>z.id===S.profile?.class_id)?.academic_year))}
function editClassId(){if(S.classId==='all')return null;return accessibleClasses().some(c=>c.id===S.classId)?S.classId:null}
function studentName(id){return S.db.students.find(s=>s.id===id)?.full_name||'—'}
function className(id){return S.db.classes.find(c=>c.id===id)?.title||'—'}
function unique(rows){return new Set(rows.map(r=>r.student_id)).size}
function metrics(classes){const ids=new Set(classes.map(c=>c.id)),students=S.db.students.filter(x=>ids.has(x.class_id)),ach=S.db.achievements.filter(x=>ids.has(x.class_id)),en=S.db.enrollments.filter(x=>ids.has(x.class_id));return {students:students.length,participating:unique(ach),entries:ach.length,winners:ach.filter(x=>x.award==='winner').length,prizes:ach.filter(x=>x.award==='prize').length,enrolled:unique(en),vud:unique(en.filter(x=>x.category==='vud')),club:unique(en.filter(x=>x.category==='club')),extra:unique(en.filter(x=>x.category==='extra'))}}
function upCounts(classes){const ids=new Set(classes.map(c=>c.id));const st=S.db.students.filter(x=>ids.has(x.class_id));return Object.fromEntries(Object.keys(upbringing).map(k=>[k,st.filter(s=>s.upbringing===k).length]))}
function metricCard(label,value,note,symbol){return `<article class="stat"><div class="stats-symbol">${symbol}</div><div class="stat-label">${esc(label)}</div><div class="stat-value">${nice(value)}</div><div class="stat-note">${esc(note)}</div></article>`}
function pageFrame(title,sub,buttons=''){return `<header class="topbar"><div><div class="eyebrow">Управление результативностью</div><h1>${title}</h1><div class="page-sub">${sub}</div></div><div class="actions">${buttons}</div></header>${workspace()}`}
function workspace(){let classes=accessibleClasses();if(S.classId!=='all'&&!classes.some(c=>c.id===S.classId))S.classId='all';if(S.role==='teacher'&&classes.length&&S.classId==='all')S.classId=S.mode==='cloud'?(classes[0].id):classes[0].id;
 let periods=[...new Set(S.db.classes.map(x=>x.academic_year))];if(!periods.includes(S.year))periods.push(S.year);periods.sort().reverse();
 let opts=`${S.role==='deputy'?'<option value="all">Все классы</option>':''}`+classes.map(c=>`<option value="${esc(c.id)}" ${S.classId===c.id?'selected':''}>${esc(c.title)} · ${esc(c.teacher_name||'без педагога')}</option>`).join('');
 return `<div class="workspace"><label for="periodYear">Учебный год</label><select id="periodYear">${periods.map(y=>`<option ${S.year===y?'selected':''}>${esc(y)}</option>`).join('')}</select><label for="periodHalf">Период</label><select id="periodHalf"><option ${S.period==='1 полугодие'?'selected':''}>1 полугодие</option><option ${S.period==='2 полугодие'?'selected':''}>2 полугодие</option><option ${S.period==='Весь год'?'selected':''}>Весь год</option></select><span class="sep"></span><label for="classSelect">Класс</label><select id="classSelect">${opts||'<option value="all">Нет доступных классов</option>'}</select><span style="margin-left:auto" class="tag ${S.mode==='demo'?'amber':'green'}">● ${S.mode==='demo'?'ДЕМО · сохранение на этом устройстве':'ОБЩАЯ БАЗА'}</span>${S.mode==='cloud'?'<button class="btn sm" data-action="refreshCloud" title="Обновить данные из общей базы">↻ Обновить</button>':''}</div>`}
function schoolRosterPanel(classes){
 if(classes.length<2)return '';
 const groups=ROSTER_GROUPS.map(g=>{
  const items=g.ids.map(title=>classes.find(c=>c.title===title)).filter(Boolean);
  if(!items.length)return '';
  return `<div class="roster-group"><div class="roster-group-head"><b>${esc(g.title)}</b><span>${items.length} классов</span></div><div class="roster-grid">${items.map(c=>{const m=metrics([c]),hasData=m.students||m.entries||m.enrolled;return `<button class="roster-tile" data-select-class="${esc(c.id)}" title="Открыть показатели ${esc(c.title)} класса"><b>${esc(c.title)}</b><span>${m.students} уч. · ${m.entries} участий</span><small class="${hasData?'has-data':''}">${hasData?'● Данные внесены':'○ Ждёт заполнения'}</small></button>`}).join('')}</div></div>`;
 }).join('');
 return `<section class="panel section"><div class="panel-head"><div><h2>Все классы школы</h2><div class="hint">Нажмите на класс, чтобы посмотреть его показатели и заполнить данные. Пустые классы тоже отображаются.</div></div><span class="tag">${classes.length} из 25</span></div>${groups}</section>`;

function overview(){const cls=chosenClasses(),m=metrics(cls),ach=scopedRows('achievements'),nums=Object.keys(levels).map(k=>ach.filter(x=>x.level===k).length),max=Math.max(1,...nums),cRows=cls.map(c=>{const t=metrics([c]);const percent=t.students?Math.round(t.participating/t.students*100):0;return `<tr><td><b>${esc(c.title)}</b></td><td>${esc(c.teacher_name||'—')}</td><td>${t.students}</td><td>${t.entries}</td><td>${t.winners+t.prizes}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress" style="flex:1"><span style="width:${percent}%"></span></div><b>${percent}%</b></div></td><td><button class="btn sm" data-scope="${esc(c.id)}">Открыть</button></td></tr>`}).join('');

function studentTable(rows){rows=rows.filter(x=>x.full_name.toLowerCase().includes(S.query.toLowerCase()));if(!rows.length)return emptyPanel('Учеников пока нет. Добавьте первый список класса.');return `<div class="table-scroll"><table><thead><tr><th>№</th><th>ФИО обучающегося</th><th>Класс</th><th>Конкурсов / соревнований</th><th>Занятий</th><th>Уровень воспитанности</th><th></th></tr></thead><tbody>${rows.map((s,i)=>{let n=S.db.achievements.filter(x=>x.student_id===s.id).length,k=S.db.enrollments.filter(x=>x.student_id===s.id).length;return `<tr><td>${i+1}</td><td><b>${esc(s.full_name)}</b></td><td>${esc(className(s.class_id))}</td><td><span class="pill">${n}</span></td><td>${k}</td><td><select data-upbringing="${esc(s.id)}" ${canEditClass(s.class_id)?'':'disabled'} style="max-width:170px;border:1px solid #dce4f0;border-radius:7px;padding:7px">${Object.entries(upbringing).map(([v,t])=>`<option value="${v}" ${s.upbringing===v?'selected':''}>${t}</option>`).join('')}</select></td><td><div class="row-actions"><button class="iconbtn" title="Изменить ФИО" data-edit-student="${esc(s.id)}">✎</button><button class="iconbtn" title="Удалить ученика и связанные записи" data-del="students:${esc(s.id)}">✕</button></div></td></tr>`}).join('')}</tbody></table></div>`}

function achievementsPage(){let rows=scopedRows('achievements').slice().filter(x=>(S.eventCategory==='all'||x.category===S.eventCategory)&&(S.eventLevel==='all'||x.level===S.eventLevel)).sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||''));const all=scopedRows('achievements');return pageFrame('Конкурсы и соревнования','Каждое участие ученика учитывается отдельно; награды и уровни суммируются автоматически.',`<button class="btn primary" data-action="openAchievement">＋ Внести участие</button>`)+`<div class="grid4">${metricCard('Творческие участия',all.filter(x=>x.category==='creative').length,'Все уровни','✧')}${metricCard('Спортивные участия',all.filter(x=>x.category==='sport').length,'Все уровни','◉')}${metricCard('Победители',all.filter(x=>x.award==='winner').length,'Количество побед','★')}${metricCard('Призёры',all.filter(x=>x.award==='prize').length,'Количество призовых результатов','◆')}</div><section class="panel section"><div class="panel-head"><h2>Журнал достижений</h2><div class="filters"><select id="filterCategory"><option value="all">Все категории</option>${Object.entries(categories).map(([k,v])=>`<option value="${k}" ${S.eventCategory===k?'selected':''}>${esc(v)}</option>`).join('')}</select><select id="filterLevel"><option value="all">Все уровни</option>${Object.entries(levels).map(([k,v])=>`<option value="${k}" ${S.eventLevel===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div></div>${achievementTable(rows)}</section><div class="note section"><b>Как считается результат.</b> Если один ученик участвовал в трёх конкурсах, это 3 участия, но 1 уникальный участник. Для общего классного мероприятия можно отметить сразу всех учеников — система создаст записи на каждого.</div>`}
function groupedPrograms(rows){const map=new Map();for(const r of rows){let key=r.category+'~~'+r.program_name.toLocaleLowerCase('ru');if(!map.has(key))map.set(key,{category:r.category,program_name:r.program_name,ids:new Set(),rowIds:[]});map.get(key).ids.add(r.student_id);map.get(key).rowIds.push(r.id)}return [...map.values()].sort((a,b)=>a.category.localeCompare(b.category)||a.program_name.localeCompare(b.program_name,'ru'))}

function reportHtml(classes){let m=metrics(classes);let top=`<article class="report"><h2>ПОКАЗАТЕЛИ РЕЗУЛЬТАТИВНОСТИ ДЕЯТЕЛЬНОСТИ</h2><p class="report-desc">МБОУ «Намская СОШ №2» · ${esc(S.year)} учебный год · ${esc(S.period)}</p><div class="report-summary"><span>Классов: ${classes.length}</span><span>Обучающихся: ${m.students}</span><span>Участий: ${m.entries}</span><span>Побед: ${m.winners}</span><span>Призовых результатов: ${m.prizes}</span></div>`;
 if(classes.length>1){top+='<h3>Сводка по классам</h3>'+reportRows([...classes.map(c=>{let x=metrics([c]);return [c.title,c.teacher_name||'—',x.students,x.entries,x.participating,x.winners,x.prizes,x.enrolled]}),['ИТОГО','',m.students,m.entries,m.participating,m.winners,m.prizes,m.enrolled]],['Класс','Классный руководитель','Обучающихся','Участий','Уникальных участников','Побед','Призовых','Занятость'])}
 for(const c of classes){const achievements=S.db.achievements.filter(x=>x.class_id===c.id),en=S.db.enrollments.filter(x=>x.class_id===c.id),st=S.db.students.filter(x=>x.class_id===c.id),x=metrics([c]);top+=`<div class="report-class"><h3>Класс ${esc(c.title)} · ${esc(c.teacher_name||'Руководитель не назначен')}</h3><p>Обучающихся: <b>${st.length}</b>. Уникальных участников конкурсов и соревнований: <b>${x.participating}</b>. Всего участий: <b>${x.entries}</b>.</p>`;
 let idx=1;for(let cat of Object.keys(categories)){top+=`<h4>${idx++}. ${esc(categories[cat])}</h4>`;for(const [level,label] of Object.entries(levels)){const rows=achievements.filter(a=>a.category===cat&&a.level===level);top+=`<p><b>${esc(label)} уровень.</b> Участий: ${rows.length}, уникальных участников: ${unique(rows)}, побед: ${rows.filter(r=>r.award==='winner').length}, призовых результатов: ${rows.filter(r=>r.award==='prize').length}.</p>`;if(rows.length)top+=reportRows(rows.map(a=>[a.event_name,forms[a.participation_form]||'—',studentName(a.student_id),a.result_text||awards[a.award],a.supervisor||'—']),['Полное наименование','Форма участия','ФИО участника','Результат','Руководитель']);}}

 }return top+'</article>'}

function managePage(){if(S.role==='teacher')return pageFrame('Классы и педагоги','Назначение педагогов доступно завучу.')+`<div class="note">Доступ к настройкам школы имеет завуч. Ваш класс назначается через административный кабинет.</div>`;const cls=activeClasses(),pro=S.db.profiles;return pageFrame('Классы и педагоги','Создание педагогов, назначение классов и управление доступом.',`<button class="btn primary" data-action="openClass">＋ Добавить класс</button>`)+teacherInviteForm()+`<section class="panel section"><div class="panel-head"><h2>Классы на выбранный период</h2><span class="tag">${cls.length}</span></div>${cls.length?`<div class="table-scroll"><table><thead><tr><th>Класс</th><th>Руководитель</th><th>Обучающихся</th><th>Участий</th><th></th></tr></thead><tbody>${cls.map(c=>`<tr><td><b>${esc(c.title)}</b></td><td>${esc(c.teacher_name||'Не назначен')}</td><td>${metrics([c]).students}</td><td>${metrics([c]).entries}</td><td><button class="btn sm" data-edit-class="${esc(c.id)}">Изменить</button> <button class="iconbtn" data-del="classes:${esc(c.id)}" title="Удалить класс со всеми данными">✕</button></td></tr>`).join('')}</tbody></table></div>`:emptyPanel('Добавьте классы для выбранного учебного периода')}</section>`+(S.mode==='cloud'?`<section class="panel section"><div class="panel-head"><div><h2>Учётные записи педагогов</h2><div class="hint">После приглашения учитель сразу появляется здесь; класс можно переназначить</div></div><span class="tag green">Общая база</span></div>${pro.length?`<div class="table-scroll"><table><thead><tr><th>Педагог</th><th>Роль</th><th>Назначен класс</th><th>Действие</th></tr></thead><tbody>${pro.map(p=>`<tr><td><b>${esc(p.full_name||'Без имени')}</b></td><td>${p.role==='teacher'?'<span class="pill green">Классный руководитель</span>':'<span class="pill">Завуч / администратор</span>'}</td><td>${esc(className(p.class_id))}</td><td>${p.role==='teacher'?`<button class="btn sm" data-assign="${esc(p.id)}">Переназначить</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:emptyPanel('Педагоги ещё не приглашены')}</section>`:'')}
function settingsPage(){const cloud=S.mode==='cloud';return pageFrame('Настройки','Локальное тестирование и подключение настоящей общей базы данных для всех педагогов.')+`<div class="layout2"><section class="panel"><div class="panel-head"><h2>Режим работы</h2><span class="tag ${cloud?'green':'amber'}">${cloud?'Подключена база':'Автономное демо'}</span></div><p class="muted">В демо данные хранятся только в браузере этого компьютера. Тестовая база «Пульс школы» в Supabase уже создана. Для общего доступа требуется авторизация учителей и размещение HTML на школьном сайте или хостинге. Не вводите реальные данные детей: сервер тестового проекта находится за пределами РФ.</p>${cloud?`<p><b>Вход:</b> ${esc(S.profile?.full_name||'—')} · ${S.role==='teacher'?'классный руководитель':'завуч'}</p><p class="mono">${esc(S.cloudCfg?.url||'')}</p><button class="btn danger" data-action="logout">Выйти из общей базы</button>`:`<div class="field"><label>Режим демонстрации</label><div class="seg"><button id="roleTeacher" class="${S.role==='teacher'?'on':''}">Классный руководитель</button><button id="roleDeputy" class="${S.role==='deputy'?'on':''}">Завуч</button></div></div><hr class="divider"><h3>Вход в тестовую базу «Пульс школы»</h3><p class="hint">Адрес и публичный ключ проекта уже заполнены. После создания учётной записи педагог входит по своей почте и паролю. До выбора инфраструктуры в РФ используйте только вымышленные или обезличенные данные.</p><form id="connectForm"><div class="field full"><label>Project URL</label><input required name="url" type="url" placeholder="https://xxxx.supabase.co" value="${esc(savedCfg().url||'')}"></div><div class="field full"><label>Publishable / anon key (не service_role)</label><textarea required name="key" rows="2" placeholder="sb_publishable_… / eyJ…">${esc(savedCfg().key||'')}</textarea></div><div class="field"><label>Электронная почта</label><input required type="email" name="email" autocomplete="username"></div><div class="field"><label>Пароль</label><input required type="password" name="password" autocomplete="current-password"></div><div class="full"><button class="btn primary" type="submit">Войти в общую базу</button></div></form>`}</section><section class="panel"><h2>Данные и учебный период</h2><p class="hint">Текущий фильтр влияет на таблицы и выгрузки. Периоды хранятся отдельно в карточках классов.</p><div class="note">Учебный год и полугодие выбираются в верхней панели. Для нового периода завуч создаёт класс с тем же номером и новым периодом — прежний отчёт сохраняется.</div>${!cloud?`<hr class="divider"><h3>Перенос демонстрационных данных</h3><div class="btn-row"><button class="btn" data-action="backupJson">⬇ Скачать JSON-копию</button><button class="btn" data-action="importJson">⬆ Импорт JSON</button><button class="btn danger" data-action="resetDemo">Сбросить демо</button></div><input id="fileImport" type="file" accept=".json,application/json" hidden>`:''}<hr class="divider"><h3>Конфиденциальность</h3><p class="hint">Списки детей — персональные данные. Текущий сервер расположен за пределами России и допускает только вымышленные или обезличенные данные. Для рабочего использования выберите инфраструктуру в РФ, ограничьте доступ педагогам и оформите необходимые документы по персональным данным. В HTML нельзя помещать секретный ключ service_role.</p></section></div>`}

function newPasswordPage(){return `<div class="password-layout"><div class="entry-brand"><span class="entry-logo">✳</span><span>Пульс школы</span></div><div class="eyebrow">Первый вход</div><h1>Создайте свой пароль</h1><p class="muted">Вы получили приглашение в школьную систему. Придумайте личный пароль: не менее 10 символов. Не передавайте его завучу и другим сотрудникам.</p><form id="newPasswordForm"><div class="field"><label>Новый пароль</label><input name="password" type="password" minlength="10" required autocomplete="new-password" placeholder="Не менее 10 символов"></div><div class="field"><label>Повторите пароль</label><input name="confirm_password" type="password" minlength="10" required autocomplete="new-password" placeholder="Повторить пароль"></div><button class="btn primary" type="submit">Сохранить пароль</button></form><p class="entry-privacy">Пароль передаётся только в Supabase Auth. Завуч не видит и не хранит его.</p></div>`}
function detectInvite(){try{const p=new URLSearchParams(location.hash.replace(/^#/,''));if(p.get('access_token')&&['invite','recovery'].includes(p.get('type'))){S.inviteToken=p.get('access_token');S.view='newPassword';return true}const err=p.get('error_description');if(err){history.replaceState(null,'',location.pathname+location.search);toast('Ссылка входа недействительна: '+err,true)}}catch{}return false}
function render(){document.querySelector('#app')?.classList.toggle('auth-gate',['signin','newPassword'].includes(S.view));if(S.view==='newPassword'){document.querySelector('#screen').innerHTML=newPasswordPage();return}if(S.view==='signin'){document.querySelector('#screen').innerHTML=signinPage();return}let nav=$('#nav');const notice=$('#modeNotice');if(notice)notice.innerHTML=S.mode==='demo'?'<div class="live-banner"><span>ⓘ</span><div><strong>Ознакомительный режим.</strong> Данные сохраняются только в этом браузере. Для работы с реальными учениками потребуется школьный защищённый сервер в РФ.</div></div>':'<div class="live-banner cloud"><span>●</span><div><strong>Подключение к базе активно.</strong> Доступ ограничен вашей учётной записью.</div></div>';nav.innerHTML=navItems.filter(([id])=>id!=='manage'||S.role!=='teacher').map(([id,ico,label])=>`<button class="nav-btn ${id===S.view?'active':''}" data-go="${id}"><span class="sym">${ico}</span>${S.mode==='cloud'&&S.role==='teacher'&&id==='overview'?'Мой класс':S.mode==='cloud'&&S.role==='teacher'&&id==='classes'?'Мои классы':label}</button>`).join('')+(S.mode==='cloud'?'<button class="nav-btn" data-action="logout"><span class="sym">⇥</span>Выйти из кабинета</button>':'<button class="nav-btn" data-action="backToLogin"><span class="sym">⇥</span>Вернуться ко входу</button>');$('#sideMode').textContent=S.mode==='cloud'?'Общая защищённая база':'Деморежим · 25 классов';$('#sideActor').textContent=S.mode==='cloud'?S.profile?.full_name||'Педагог':S.role==='teacher'?'Классный руководитель':'Завуч';$('#sidePeriod').textContent=`${S.year} · ${S.period}`;
 if(S.mode==='cloud'&&!S.profile){$('#screen').innerHTML='<div class="signin"><div class="panel"><h2>Вход в школьную систему</h2><p class="muted">Для продолжения требуется авторизация.</p><button class="btn" data-action="logout">Вернуться к демо</button></div></div>';return}
 const views={overview,classes:classesPage,students:studentsPage,achievements:achievementsPage,activities:activitiesPage,reports:reportsPage,manage:managePage,settings:settingsPage};$('#screen').innerHTML=(views[S.view]||overview)();}

function studentsModal(){if(!accessibleClasses().length){toast('Сначала добавьте класс во вкладке «Классы и педагоги»',true);return}openModal('Добавить обучающихся',`<form id="studentForm">${classPicker()}<div class="field"><label>ФИО учеников — каждое с новой строки</label><textarea name="names" required rows="8" placeholder="Иванова Анна Сергеевна&#10;Петров Иван Максимович&#10;..."></textarea><span class="small-caption">Можно вставить сразу весь список класса из таблицы.</span></div><div class="modal-footer"><button type="button" class="btn" data-action="closeModal">Отмена</button><button class="btn primary" type="submit">Добавить учеников</button></div></form>`)}
function studentCheckboxes(classid,checked=[]){const st=S.db.students.filter(x=>x.class_id===classid).sort((a,b)=>a.full_name.localeCompare(b.full_name,'ru'));return st.length?`<label style="display:flex;align-items:center;gap:8px;margin:10px 0"><input id="allStudents" type="checkbox"> Отметить всех учеников</label><div class="check-list" id="checkStudents">${st.map(s=>`<label><input type="checkbox" name="student_ids" value="${esc(s.id)}" ${checked.includes(s.id)?'checked':''}> ${esc(s.full_name)}</label>`).join('')}</div>`:`<div class="note warning">В этом классе ещё нет учеников. Сначала добавьте список детей.</div>`}
function achievementModal(){const id=editClassId()||accessibleClasses()[0]?.id;if(!id){toast('Сначала добавьте класс',true);return}openModal('Внести конкурс или соревнование',`<form id="achievementForm"><div class="formgrid"><div class="full" id="achClass">${classPicker(id)}</div><div class="field"><label>Раздел отчёта</label><select required name="category"><option value="creative">Творческие конкурсы</option><option value="sport">Спортивные соревнования</option></select></div><div class="field"><label>Уровень</label><select required name="level">${Object.entries(levels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field full"><label>Полное название мероприятия</label><input required name="event_name" placeholder="Название конкурса или соревнования"></div><div class="field"><label>Форма участия</label><select name="participation_form">${Object.entries(forms).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Дата (необязательно)</label><input type="date" name="event_date"></div><div class="field"><label>Результат, диплом, место</label><input name="result_text" placeholder="Диплом 2 степени"></div><div class="field"><label>Тип достижения</label><select name="award"><option value="participant">Участие</option><option value="winner">Победитель</option><option value="prize">Призёр</option></select></div><div class="field full"><label>Руководитель / тренер</label><input name="supervisor" placeholder="ФИО педагога"></div><div class="full"><label style="font-weight:750;color:#496080;font-size:12px">Участники (можно несколько)</label><div id="studentPick">${studentCheckboxes(id)}</div></div></div><div class="modal-footer"><button class="btn" type="button" data-action="closeModal">Отмена</button><button class="btn primary" type="submit">Сохранить участие</button></div></form>`)}
function enrollmentModal(){let id=editClassId()||accessibleClasses()[0]?.id;if(!id){toast('Сначала добавьте класс',true);return}openModal('Записать на занятие',`<form id="enrollmentForm">${classPicker(id)}<div class="field"><label>Категория</label><select name="category">${Object.entries(programs).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Название кружка или курса</label><input required name="program_name" placeholder="Например, Читалочка / ДШИ / ДЮСШ"></div><label style="font-weight:750;color:#496080;font-size:12px">Посещающие ученики</label><div id="studentPick">${studentCheckboxes(id)}</div><div class="modal-footer"><button class="btn" type="button" data-action="closeModal">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form>`)}
function classModal(id){const c=S.db.classes.find(x=>x.id===id);openModal(c?'Изменить класс':'Добавить класс',`<form id="classForm"><input type="hidden" name="id" value="${esc(id||'')}"><div class="formgrid"><div class="field"><label>Класс</label><input name="title" required placeholder="2А" value="${esc(c?.title||'')}"></div><div class="field"><label>Учебный год</label><input name="academic_year" required placeholder="2026–2027" value="${esc(c?.academic_year||S.year)}"></div><div class="field"><label>Отчётный период</label><select name="period">${['1 полугодие','2 полугодие','Весь год'].map(x=>`<option ${x===(c?.period||S.period)?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Классный руководитель</label><input name="teacher_name" placeholder="Фамилия И. О." value="${esc(c?.teacher_name||'')}"></div></div><div class="modal-footer"><button type="button" class="btn" data-action="closeModal">Отмена</button><button class="btn primary" type="submit">Сохранить класс</button></div></form>`)}

async function updateLocalOrCloud(table,verb,record,query){if(S.mode==='demo'){if(verb==='POST')S.db[table].push(...(Array.isArray(record)?record:[record]));if(verb==='PATCH'){const id=query;S.db[table]=S.db[table].map(x=>x.id===id?{...x,...record}:x)}if(verb==='DELETE'){const ids=new Set(Array.isArray(query)?query:[query]);S.db[table]=S.db[table].filter(x=>!ids.has(x.id));if(table==='classes'){const childIds=new Set([...ids]);const pupils=S.db.students.filter(s=>childIds.has(s.class_id)).map(s=>s.id);for(const t of ['students','achievements','enrollments'])S.db[t]=S.db[t].filter(x=>!childIds.has(x.class_id)&&!pupils.includes(x.id))}if(table==='students'){let ids2=new Set(Array.isArray(query)?query:[query]);S.db.achievements=S.db.achievements.filter(x=>!ids2.has(x.student_id));S.db.enrollments=S.db.enrollments.filter(x=>!ids2.has(x.student_id))}}persist();return}
 if(verb==='DELETE'&&Array.isArray(query)){for(const id of query)await api(table,'DELETE',null,`id=eq.${encodeURIComponent(id)}`)}else await api(table,verb,record,verb==='POST'?'':`id=eq.${encodeURIComponent(query)}`);await reloadCloud()}
async function handleSubmit(e){const f=e.target;if(!['studentForm','achievementForm','enrollmentForm','classForm','assignForm','connectForm','portalLogin','teacherInviteForm','newPasswordForm'].includes(f.id))return;e.preventDefault();let d=Object.fromEntries(new FormData(f));try{setFormBusy(f,true);if(f.id==='portalLogin'){const cfg=savedCfg();await connectCloud(cfg.url,cfg.key,d.email,d.password);toast('Вход выполнен');render();return;}

function generateXlsx(){const cls=chosenClasses(),ids=new Set(cls.map(x=>x.id)),ach=scopedRows('achievements'),en=scopedRows('enrollments'),students=scopedRows('students');const m=metrics(cls),sheets=[['Сводка',[['Класс','Классный руководитель','Обучающихся','Участий','Уникальных участников','Победы','Призёры','Занятые'],...cls.map(c=>{let x=metrics([c]);return [c.title,c.teacher_name,x.students,x.entries,x.participating,x.winners,x.prizes,x.enrolled]}),['ИТОГО','',m.students,m.entries,m.participating,m.winners,m.prizes,m.enrolled]]],['Конкурсы и спорт',[['Класс','ФИО','Категория','Уровень','Мероприятие','Форма','Результат','Награда','Руководитель','Дата'],...ach.map(x=>[className(x.class_id),studentName(x.student_id),categories[x.category],levels[x.level],x.event_name,forms[x.participation_form],x.result_text,awards[x.award],x.supervisor,x.event_date||''])]],['Занятость',[['Класс','ФИО','Категория','Название'],...en.map(x=>[className(x.class_id),studentName(x.student_id),programs[x.category],x.program_name])]],['Воспитанность',[['Класс','ФИО','Уровень'],...students.map(x=>[className(x.class_id),x.full_name,upbringing[x.upbringing]||'Не указано'])]]];let files={'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>','_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([name],i)=>`<sheet name="${xml(name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`,'xl/_rels/workbook.xml.rels':`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,'xl/styles.xml':'<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/><color rgb="FFFFFFFF"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF315CDB"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFill="1" applyFont="1"/></cellXfs></styleSheet>'};sheets.forEach(([,rows],i)=>files[`xl/worksheets/sheet${i+1}.xml`]=worksheet(rows));return zipFiles(files)}
function downloadReport(kind){if(!chosenClasses().length){toast('Нет классов для отчёта',true);return}const b=kind==='docx'?generateDocx():generateXlsx();saveBlob(filenameBase()+'.'+kind,kind==='docx'?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',b);toast('Отчёт '+kind.toUpperCase()+' сформирован')}
function doPrint(){if(!chosenClasses().length){toast('Нет данных для отчёта',true);return}$('#printArea').innerHTML=reportHtml(chosenClasses());window.print()}
function localAction(name){switch(name){case'enterDemo':S.mode='demo';S.db=readDemo();S.role='deputy';S.view='overview';S.classId='all';render();return;case'backToLogin':S.view='signin';S.role='deputy';S.classId='all';render();return;case'openStudents':return studentsModal();case'openAchievement':return achievementModal();case'openEnrollment':return enrollmentModal();case'openClass':return classModal();case'closeModal':return closeModal();case'exportDocx':return downloadReport('docx');case'exportXlsx':return downloadReport('xlsx');case'printReport':return doPrint();case'logout':return logout();case'refreshCloud':return reloadCloud().then(()=>{render();toast('Данные из общей базы обновлены')}).catch(e=>toast(e.message,true));case'backupJson':return saveBlob('Пульс_школы_резервная_копия.json','application/json;charset=utf-8',JSON.stringify(S.db,null,2));case'importJson':return $('#fileImport')?.click();case'resetDemo':if(confirm('Сбросить текущие локальные данные и загрузить демонстрационные примеры?')){S.db=seed();persist();S.view='overview';render();toast('Демо сброшено')}return}}
async function importJson(f){if(!f)return;try{const db=JSON.parse(await f.text());if(!['classes','students','achievements','enrollments'].every(k=>Array.isArray(db[k])))throw Error('Неверный формат файла');if(!confirm('Заменить ВСЕ локальные данные импортированным файлом?'))return;S.db={...emptyDB(),...db};persist();S.classId='all';S.view='overview';render();toast('Данные импортированы')}catch(e){toast('Ошибка импорта: '+e.message,true)}}
$('#modalClose').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});document.addEventListener('submit',e=>{if(e.target.id==='connectForm'){e.preventDefault();handleSubmit(e)}else handleSubmit(e)});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='periodYear'){S.year=t.value;S.classId='all';render()}if(t.id==='periodHalf'){S.period=t.value;S.classId='all';render()}if(t.id==='classSelect'){S.classId=t.value;render()}if(t.id==='filterCategory'){S.eventCategory=t.value;render()}if(t.id==='filterLevel'){S.eventLevel=t.value;render()}if(t.dataset.upbringing)await changeUpbringing(t.dataset.upbringing,t.value);if(t.name==='class_id'&&t.closest('#achievementForm,#enrollmentForm'))$('#studentPick').innerHTML=studentCheckboxes(t.value);if(t.id==='allStudents')$$('#checkStudents [name="student_ids"]').forEach(x=>x.checked=t.checked);if(t.id==='fileImport')await importJson(t.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='classQuery'){const q=e.target.value.toLocaleLowerCase('ru').trim();document.querySelectorAll('.roster-tile').forEach(x=>{x.style.display=x.textContent.toLocaleLowerCase('ru').includes(q)?'':'none'});document.querySelectorAll('.roster-group').forEach(g=>{g.style.display=[...g.querySelectorAll('.roster-tile')].some(x=>x.style.display!=='none')?'':'none'});return}if(e.target.id==='studentSearch'){S.query=e.target.value;const st=scopedRows('students').sort((a,b)=>className(a.class_id).localeCompare(className(b.class_id),'ru')||a.full_name.localeCompare(b.full_name,'ru'));$('#studentList').innerHTML=studentTable(st)}});
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='mobileMenu'){document.querySelector('.sidebar')?.classList.toggle('is-open');return}if(t.dataset.go||t.dataset.selectClass)document.querySelector('.sidebar')?.classList.remove('is-open');if(t.dataset.go){S.view=t.dataset.go;S.query='';render();scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.action)return localAction(t.dataset.action);if(t.dataset.selectClass){S.classId=t.dataset.selectClass;S.view='overview';render();scrollTo({top:0,behavior:'smooth'});return}if(t.dataset.scope){S.classId=t.dataset.scope;S.view='students';render();scrollTo(0,0);return}if(t.dataset.editStudent)return editStudent(t.dataset.editStudent);if(t.dataset.editClass)return classModal(t.dataset.editClass);if(t.dataset.assign)return assignModal(t.dataset.assign);if(t.dataset.del){let [type,id]=t.dataset.del.split(':');return deleteRecord(type,id)}if(t.dataset.delProgram){const ids=t.dataset.delProgram.split(',');if(confirm(`Удалить ${ids.length} записей направления?`)){try{await updateLocalOrCloud('enrollments','DELETE',null,ids);render();toast('Записи удалены')}catch(e){toast(e.message,true)}}return}if(t.id==='roleTeacher'){S.role='teacher';S.classId=accessibleClasses()[0]?.id||'all';S.view='overview';render()}if(t.id==='roleDeputy'){S.role='deputy';S.classId='all';S.view='overview';render()}});
persist();detectInvite();render();if(S.view!=='newPassword')bootCloud();
